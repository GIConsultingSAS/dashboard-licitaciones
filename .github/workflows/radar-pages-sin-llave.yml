name: Radar SECOP II - Pages sin llave privada
on:
  schedule:
    - cron: '0 11 * * *'  # 06:00 America/Bogota
  workflow_dispatch:
    inputs:
      modo:
        description: 'Validar sin publicar o publicar solo el radar temporal'
        required: true
        type: choice
        default: validar
        options:
          - validar
          - publicar

permissions: {}

concurrency:
  group: radar-secop2-pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout sin credenciales persistentes
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Pruebas del clasificador
        run: node --test "scripts/*.test.mjs"

      - name: Consultar SECOP II y generar HTML
        run: node scripts/actualizar_radar.mjs

      - name: Verificar integridad de salida
        run: node scripts/validar-publicacion.mjs

      - name: Preparar solo archivos publicos
        run: |
          mkdir -p _site
          cp index.html cargoport-propuesta.html _site/
          test "$(find _site -type f | wc -l)" -eq 2

      - name: Configurar GitHub Pages
        if: github.event_name == 'schedule' || github.event.inputs.modo == 'publicar'
        uses: actions/configure-pages@v5

      - name: Subir artefacto de Pages
        if: github.event_name == 'schedule' || github.event.inputs.modo == 'publicar'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publicar:
    if: github.event_name == 'schedule' || github.event.inputs.modo == 'publicar'
    needs: construir
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Publicar solo el artefacto validado
        id: deployment
        uses: actions/deploy-pages@v4
