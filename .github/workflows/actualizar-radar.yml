name: Actualizar radar SECOP II

on:
  schedule:
    - cron: '0 11 * * *'   # 06:00 hora de Colombia (UTC-5)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: actualizar-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Consultar SECOP II y regenerar el radar
        run: node scripts/actualizar_radar.mjs

      - name: Publicar si hubo cambios
        run: |
          if git diff --quiet -- index.html; then
            echo "Sin cambios en el radar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "update: radar SECOP II $(TZ=America/Bogota date +%F)"
          git push

      - name: Pedir a GitHub Pages que publique la nueva versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent
